    server {
        listen 443 ssl;
        server_name zslab-mall.duckdns.org;
        server_tokens off;

        ssl_certificate     /etc/nginx/certs/zslab-mall.duckdns.org/fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/zslab-mall.duckdns.org/privkey.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 50m;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

        # PG 웹훅은 내부 네트워크에서만 호출 — 외부 노출 차단(존재 은폐를 위해 404)
        location ^~ /api/webhooks {
            return 404;
        }

        # 로그인 무차별 대입 완화 — IP당 분당 10회·burst 5
        location = /api/v1/auth/buyer/login {
            limit_req zone=zslab_mall_login burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 1m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }
        # 비밀번호 재설정 요청 남용 완화(D-269) — 로그인과 같은 zone 공유
        location = /api/v1/auth/password-reset/request {
            limit_req zone=zslab_mall_login burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 1m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }
        location = /api/v1/seller/auth/login {
            limit_req zone=zslab_mall_login burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 1m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }
        location = /api/v1/admin/auth/login {
            limit_req zone=zslab_mall_login burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 1m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }

        # 회원가입 대량 요청 완화(D-267 SEC-09) — 로그인과 같은 zone 공유
        location = /api/v1/users {
            limit_req zone=zslab_mall_login burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 10m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }

        location = /api/v1/claims/attachments {
            client_max_body_size 26m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }

        location = /api/v1/admin/files/images {
            client_max_body_size 220m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }

        location = /api/v1/seller/files/images {
            client_max_body_size 220m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }

        location /api {
            client_max_body_size 10m;
            set $upstream_mall_api http://zslab_mall_backend:8080;
            proxy_pass $upstream_mall_api;
        }

        location / {
            set $upstream_mall_front http://zslab_mall_frontend:3000;
            proxy_pass $upstream_mall_front;
        }
    }

    # Plotline — 데이터 스크롤리텔링 (zeus721-zslab/plotline)
    # 경로 라우팅(정적·/api·/data)은 plotline-web 컨테이너의 nginx가 처리한다.
    # X-Content-Type-Options · Referrer-Policy 는 plotline-web 이 붙이므로 여기서는 중복 추가하지 않는다.
    server {
        listen 443 ssl;
        server_name plotline.duckdns.org;
        server_tokens off;

        ssl_certificate     /etc/nginx/certs/plotline.duckdns.org/fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/plotline.duckdns.org/privkey.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 10m;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

        location / {
            set $upstream_plotline_web http://plotline-web:80;
            proxy_pass $upstream_plotline_web;
        }
    }
}
