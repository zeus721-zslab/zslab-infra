version: "3.9"

networks:
  infra_net:
    external: true
    name: infra_net
  gateway_net:
    external: true
    name: gateway_net
  zslab_net:
    external: true
    name: zslab_zslab_net
  portfolio_net:
    external: true
    name: portfolio_portfolio_net

volumes:
  mariadb_data:
    external: true
    name: zslab_mariadb_data
  redis_data:
    external: true
    name: zslab_redis_data
  elasticsearch_data:
    external: true
    name: zslab_elasticsearch_data
  kibana_data:
    external: true
    name: zslab_kibana_data

services:
  mariadb:
    image: mariadb:10.11
    container_name: zslab_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      infra_net: {}
      zslab_net: {}

  redis:
    image: redis:7-alpine
    container_name: zslab_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      infra_net: {}
      zslab_net: {}

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: zslab_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      infra_net: {}
      zslab_net: {}

  logstash:
    image: logstash:8.13.0
    container_name: zslab_logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      infra_net: {}
    depends_on:
      - elasticsearch

  kibana:
    image: kibana:8.13.0
    container_name: zslab_kibana
    restart: unless-stopped
    volumes:
      - ./docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - kibana_data:/usr/share/kibana/data
    networks:
      infra_net: {}
      gateway_net: {}
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: zslab_filebeat
    restart: unless-stopped
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /home/zslab/backend/storage/logs:/logs/laravel:ro
      - /home/gateway/logs/nginx:/logs/nginx:ro
    networks:
      - infra_net
    depends_on:
      - logstash

  zslab-realtime:
    build:
      context: ./zslab-realtime
    container_name: zslab_realtime
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - REALTIME_PORT=3010
      - CORS_ORIGIN=${REALTIME_CORS_ORIGIN}
      - INTERNAL_KEY=${REALTIME_INTERNAL_KEY}
    networks:
      - infra_net
      - gateway_net
      - portfolio_net
    expose:
      - "3010"
